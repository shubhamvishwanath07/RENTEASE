<div style="padding:2rem 0 4rem;">
  <div class="container">
    <div class="mb-4">
      <h3 style="font-family:'Poppins',sans-serif; font-weight:700; color:#1a2e4a;">
        <i class="fas fa-heart me-2" style="color:#e74c3c;"></i>Saved Properties
      </h3>
      <p style="color:#6c757d;">Properties you've saved for later</p>
    </div>

    <div class="loading-spinner" ng-if="loading"><div class="spinner-border"></div></div>

    <div class="empty-state" ng-if="!loading && favorites.length === 0">
      <i class="fas fa-heart-broken"></i>
      <h5>No Saved Properties</h5>
      <p>Click the heart icon on any property to save it here.</p>
      <a href="#!/properties" class="btn-view mt-2" style="padding:10px 24px;">Browse Properties</a>
    </div>

    <div class="row g-4" ng-if="!loading && favorites.length > 0">
      <div class="col-lg-3 col-md-6" ng-repeat="prop in favorites">
        <div class="property-card">
          <div class="property-img-wrap">
            <img ng-src="{{prop.images && prop.images.length ? prop.images[0] : 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=800'}}" alt="{{prop.title}}" loading="lazy">
            <span class="property-badge">{{prop.bhkType}}</span>
            <button class="heart-btn active" ng-click="remove(prop._id)">
              <i class="fas fa-heart"></i>
            </button>
          </div>
          <div class="property-body">
            <div class="property-price">₹{{prop.rent | number}}<span>/month</span></div>
            <div class="property-title">{{prop.title}}</div>
            <div class="property-location"><i class="fas fa-map-marker-alt"></i>{{prop.location}}</div>
            <div class="property-chips">
              <span class="chip">{{prop.furnished}}</span>
              <span class="chip" ng-if="prop.area">{{prop.area}} sq.ft</span>
            </div>
            <div class="property-footer">
              <div class="rating-badge"><i class="fas fa-star"></i> {{prop.rating || '4.0'}}</div>
              <a class="btn-view" href="#!/property/{{prop._id}}">View</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
